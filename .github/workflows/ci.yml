name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, bcmath, pcov
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan level 8)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fretehub_test
          POSTGRES_USER: fretehub
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, bcmath, pcov
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: cp .env.example .env.testing

      - name: Configure test environment
        run: |
          echo "APP_KEY=$(php artisan key:generate --show)" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_DATABASE=fretehub_test" >> .env.testing
          echo "DB_USERNAME=fretehub" >> .env.testing
          echo "DB_PASSWORD=secret" >> .env.testing
          echo "REDIS_HOST=127.0.0.1" >> .env.testing
          echo "QUEUE_CONNECTION=sync" >> .env.testing
          echo "CACHE_STORE=array" >> .env.testing

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run tests with coverage
        run: php artisan test --env=testing --coverage --min=80
